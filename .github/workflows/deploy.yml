name: Build and Deploy to K3s

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/k3s-mission-control

jobs:
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: |
          docker build -t $IMAGE_NAME:latest .
          docker tag  $IMAGE_NAME:latest $IMAGE_NAME:${{ github.sha }}
      - run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

  deploy:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
      - name: Write kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Update image tag
        run: |
          sed -i "s|YOUR_DOCKERHUB_USERNAME/k3s-mission-control:latest|$IMAGE_NAME:${{ github.sha }}|g" k8s/deployment.yaml
      - name: Apply all manifests
        run: |
          kubectl apply -f k8s/volume.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
      - name: Wait for rollout
        run: kubectl rollout status deployment/mission-control --timeout=120s
      - name: Show final state
        run: |
          kubectl get pods
          kubectl get service
          kubectl get ingress
