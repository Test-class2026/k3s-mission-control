# ── Image ───────────────────────────────────────────────
image:
  repository: felixanxy/k3s-mission-control
  tag: "latest"
  pullPolicy: Always

# ── Deployment ──────────────────────────────────────────
replicaCount: 2

strategy:
  type: RollingUpdate
  maxUnavailable: 1
  maxSurge: 1

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

# ── Service ─────────────────────────────────────────────
service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30080

# ── Application Config (ConfigMap) ──────────────────────
config:
  appName: "K3s Mission Control"
  appEnv:  "production"
  version: "v3"
  port:    "3000"

# ── Secrets ─────────────────────────────────────────────
# Do not put real secrets here.
# Override these with --set at deploy time or via CI/CD secrets.
secrets:
  apiKey: "changeme"

# ── Persistent Storage ──────────────────────────────────
persistence:
  enabled: true
  size: 500Mi
  mountPath: /app/data
  hostPath: /data/mission-control

# ── Ingress ─────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: mission-control.local